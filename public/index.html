<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      #textField {

      body {
        background: rgb(255, 255, 255);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 1) 0%,
          rgba(41, 165, 255, 1) 50%,
          rgba(41, 165, 255, 1) 67%,
          rgba(255, 255, 255, 1) 85%
        );
        min-height: 100vh;
      }

    <script>
      // HIER AANPASSEN!!!!!!
      const socket = new WebSocket("ws://192.168.2.163:8080")
      // HIER AANPASSEN!!!!!!

      // Event listener for WebSocket connection open
      socket.addEventListener("open", () => {
        console.log("Connected to WebSocket server.")
      })

      // Function to send messages
      function sendMessage(message) {
        socket.send(message)
      }

      document.addEventListener("keydown", function (n) {
        input.focus()
        input.select()
      })

      // Get the current URL path
      const path = window.location.pathname;

      // Define a mapping of paths to video sources
      const videoMap = {
        '/grid/A1': 'videos/videoA1.mp4',
        '/grid/A2': 'videos/videoA2.mp4',
        // Add more mappings as needed
      };

      // Get the video source based on the path
      const videoSrc = videoMap[path] || 'videos/defaultVideo.mp4';

      // Function to set the video source dynamically
      const setVideoSource = () => {
        const videoElement = document.getElementById('theImage');
        if (videoElement) {
          videoElement.src = videoSrc;
          videoElement.play();
        }
      };

      // Set the video source on page load
      window.addEventListener('DOMContentLoaded', setVideoSource);
    </script>
    <title>Dynamic Video Loader</title>
  </head>
  <body></body>
    <input type="text" id="textField" />
    <div id="gescandeBarcode"></div>
    <div id="notes"></div>
    <video id="theImage" autoplay muted loop playsinline></video>
  </body>
  <!-- <script src="zScan.min.js"></script> -->
  <script>
    var input = document.getElementById("textField")
    let notes = document.getElementById("notes")
    input.focus()
    input.select()
    // alert("input")
    input.oninput = function () {
      sendMessage(input.value)

      fetch("/database.json")
        .then((response) => response.json())
        .then((json) => {
          notes.innerHTML = ""
          if (json[input.value].note != undefined) {
            notes.innerHTML = json[input.value].note
          }
          if (!Object.getOwnPropertyNames(json).includes(input.value)) {
            return
          }
          let data = json[input.value]

          return json
        })

      // input.value = ""
    }
  </script>
